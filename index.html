<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#264a3f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="案例库">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>知产案例库</title>
<style>
:root{
  --bg:#f7f7f5;
  --bg-2:#ffffff;
  --ink:#1f2328;
  --ink-2:#5c636b;
  --ink-3:#979ea6;
  --line:#e8e6e1;
  --line-2:#f0eee9;
  --accent:#264a3f;
  --accent-soft:#eef2f0;
  --warm:#b4693f;
  --warn-bg:#fdf6ef;
  --shadow:0 1px 2px rgba(28,32,36,.04),0 6px 20px rgba(28,32,36,.05);
  --r:14px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
html[data-theme="dark"]{
  --bg:#15181a;
  --bg-2:#1d2124;
  --ink:#e8e9e7;
  --ink-2:#a3aaa9;
  --ink-3:#6f7676;
  --line:#2b3034;
  --line-2:#23282b;
  --accent:#7fb09c;
  --accent-soft:#1f2b28;
  --warm:#d19a72;
  --warn-bg:#241f1a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.24);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);color:var(--ink);
  font:15px/1.62 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
input,textarea,select{font-family:inherit;font-size:15px;color:inherit}
input:focus,textarea:focus,select:focus{outline:none}
::-webkit-scrollbar{width:0;height:0}

/* ---------- 布局 ---------- */
#app{min-height:100%;max-width:600px;margin:0 auto;padding-bottom:calc(64px + var(--safe-b))}
.page{display:none;padding:0 16px;animation:in .18s ease}
.page.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.top{
  position:sticky;top:0;z-index:20;
  padding:calc(14px + var(--safe-t)) 16px 10px;margin:0 -16px 4px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.3) blur(14px);
  border-bottom:1px solid var(--line-2);
}
.top h1{margin:0;font-size:19px;font-weight:650;letter-spacing:.2px}
.top p{margin:2px 0 0;font-size:12.5px;color:var(--ink-3)}
.top-row{display:flex;align-items:center;gap:10px}
.top-row .sp{flex:1}

/* ---------- 底部导航 ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  max-width:600px;margin:0 auto;
  display:flex;align-items:flex-end;justify-content:space-around;
  padding:6px 6px calc(6px + var(--safe-b));
  background:color-mix(in srgb,var(--bg-2) 92%,transparent);
  backdrop-filter:saturate(1.4) blur(16px);
  border-top:1px solid var(--line);
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:5px 0 3px;color:var(--ink-3);font-size:11px;letter-spacing:.3px;
}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}
.tab.mid{position:relative;flex:none;width:62px}
.tab.mid .orb{
  width:52px;height:52px;border-radius:50%;
  background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;
  margin-top:-22px;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent);
}
.tab.mid .orb svg{width:26px;height:26px;stroke-width:2.2}
.tab.mid span{color:var(--ink-3);font-size:11px;margin-top:2px}

/* ---------- 通用组件 ---------- */
.card{
  background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--line);background:var(--bg-2);border-radius:11px;
  padding:9px 14px;font-size:14px;color:var(--ink);
}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.gh{border-color:transparent;background:none;color:var(--ink-2)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.wide{width:100%}
.btn.dg{color:#b4544a;border-color:transparent;background:none}
.chip{
  border:1px solid var(--line);background:var(--bg-2);border-radius:999px;
  padding:5px 12px;font-size:12.5px;color:var(--ink-2);white-space:nowrap;
}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.row{display:flex;gap:10px;align-items:center}
.muted{color:var(--ink-3);font-size:12.5px}
.hr{height:1px;background:var(--line-2);margin:14px 0}
.sec-t{font-size:12.5px;color:var(--ink-3);letter-spacing:.6px;margin:18px 0 9px;display:flex;align-items:center;gap:8px}
.sec-t .lnk{margin-left:auto;color:var(--accent);letter-spacing:0;cursor:pointer;font-size:12px}
.sec-t .lnk:active{opacity:.6}
.live-tip{
  display:flex;align-items:center;gap:6px;margin:10px 0 2px;padding:10px 12px;
  border-radius:var(--r);background:var(--bg-2);border:1px solid var(--line);
  font-size:13px;color:var(--ink-2);cursor:pointer;
}
.live-tip span{margin-left:auto;color:var(--accent);font-size:15px}
.live-tip:active{opacity:.7}

/* ---------- 首页轮播 ---------- */
.slider{position:relative;margin-top:12px}
.slide{
  padding:18px 18px 16px;border-radius:var(--r);margin-bottom:10px;
  background:var(--bg-2);border:1px solid var(--line);box-shadow:var(--shadow);
  position:relative;
}
.slide .kick{font-size:11.5px;color:var(--ink-3);letter-spacing:.6px}
.slide h3{margin:8px 0 8px;font-size:17px;line-height:1.5;font-weight:650;padding-right:38px}
.slide .focus{font-size:13.5px;color:var(--ink-2);line-height:1.7}
.slide .add{
  position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:50%;
  border:1px solid var(--line);background:var(--bg-2);
  display:flex;align-items:center;justify-content:center;color:var(--accent);
}
.slide .add svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.dots{display:flex;justify-content:center;gap:5px;margin-top:10px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--accent);width:14px}

/* ---------- 案例卡 ---------- */
.case{
  padding:14px 15px;margin-bottom:10px;
  background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);position:relative;
}
.case:active{transform:scale(.995)}
.case h4{margin:0;font-size:15px;font-weight:600;line-height:1.5;padding-right:34px}
.case .fc{margin:7px 0 0;font-size:13.5px;color:var(--ink);line-height:1.65}
.case .br{margin:4px 0 0;font-size:12px;color:var(--ink-3);line-height:1.6}
.case .add{
  position:absolute;right:11px;top:12px;width:28px;height:28px;border-radius:50%;
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--accent);
}
.case .add svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.case .mt{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.tag{font-size:11px;color:var(--ink-2);background:var(--line-2);border-radius:6px;padding:2px 7px}
.tag.k{background:var(--accent-soft);color:var(--accent)}
.tag.warn{background:var(--warn-bg);color:var(--warm)}
.tag.ok{background:var(--accent-soft);color:var(--accent);opacity:.75}
.feed-more{text-align:center;font-size:12px;color:var(--ink-3);padding:16px 0 4px}
.grade{font-size:10.5px;padding:1px 6px;border-radius:5px;border:1px solid var(--line);color:var(--ink-3)}
.grade.a{color:var(--accent);border-color:var(--accent)}
.grade.c{color:var(--warm);border-color:var(--warm)}

/* ---------- 筛选 ---------- */
.dims{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch}
.filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}

/* ---------- 表单 ---------- */
.f{margin-bottom:13px}
.f label{display:block;font-size:12px;color:var(--ink-3);margin-bottom:5px;letter-spacing:.3px}
.f input,.f textarea,.f select{
  width:100%;border:1px solid var(--line);border-radius:11px;background:var(--bg-2);
  padding:10px 12px;
}
.f textarea{min-height:80px;resize:vertical;line-height:1.7}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ti{width:100%;font-size:20px;font-weight:650;border:none;background:none;padding:2px 0 8px}

/* ---------- 详情 ---------- */
.blk{margin:16px 0}
.blk h5{margin:0 0 5px;font-size:12px;color:var(--ink-3);letter-spacing:.6px;font-weight:600}
.blk p{margin:0;font-size:14.5px;line-height:1.85;white-space:pre-wrap}
.quote{border-left:2px solid var(--accent);padding-left:12px}

/* ---------- AI ---------- */
.chat{padding:0 0 8px}
.msg{margin-bottom:14px;display:flex;gap:9px}
.msg .av{
  width:28px;height:28px;border-radius:50%;flex:none;
  background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:12px;
}
.msg.me .av{background:var(--line-2);color:var(--ink-2)}
.msg .bd{flex:1;font-size:14.5px;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.msg .bd .srcs{margin-top:8px;font-size:12px;color:var(--ink-3);border-top:1px dashed var(--line);padding-top:7px}
.msg .bd .srcs a{color:var(--accent);text-decoration:none}
.bar{
  position:sticky;bottom:calc(64px + var(--safe-b));z-index:30;
  display:flex;gap:8px;align-items:flex-end;padding:10px 0;margin:0 -16px;
  background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);
  border-top:1px solid var(--line-2);
}
.bar textarea{
  flex:1;min-height:42px;max-height:120px;border:1px solid var(--line);
  border-radius:12px;background:var(--bg-2);padding:10px 12px;resize:none;line-height:1.6;
}
.bar .send{
  height:42px;padding:0 15px;border-radius:12px;background:var(--accent);color:#fff;
  display:flex;align-items:center;font-size:14px;
}
.bar .send[disabled]{opacity:.45}

/* ---------- 弹层 ---------- */
.mask{position:fixed;inset:0;z-index:80;background:rgba(20,24,26,.36);display:flex;align-items:flex-end;justify-content:center}
.sheet{
  width:100%;max-width:600px;background:var(--bg);border-radius:18px 18px 0 0;padding:18px 16px calc(20px + var(--safe-b));
  max-height:88vh;overflow:auto;animation:up .2s ease;
}
@keyframes up{from{transform:translateY(20px);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 3px;font-size:17px}
.sheet .sub{margin:0 0 14px;font-size:12.5px;color:var(--ink-3)}
.drop{
  border:1.5px dashed var(--line);border-radius:14px;background:var(--bg-2);
  padding:24px 16px;text-align:center;margin-bottom:14px;
}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .b{font-size:14px;font-weight:600}
.drop .s{font-size:12px;color:var(--ink-3);margin-top:3px}
.opt{
  display:flex;align-items:center;gap:11px;padding:12px 13px;
  border:1px solid var(--line);border-radius:12px;background:var(--bg-2);margin-bottom:9px;width:100%;text-align:left;
}
.opt .ic{
  width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;flex:none;
}
.opt .ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.opt .t{font-size:14.5px;font-weight:600}
.opt .d{font-size:12px;color:var(--ink-3);margin-top:1px}
.toast{
  position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);font-size:13px;padding:9px 16px;border-radius:999px;z-index:99;
  box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:80vw;text-align:center;
}
.empty{text-align:center;color:var(--ink-3);font-size:13.5px;padding:44px 0}
.pill{font-size:12px;background:var(--line-2);border-radius:8px;padding:4px 9px;color:var(--ink-2)}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sw{width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;transition:.2s;flex:none}
.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--accent)}
.sw.on i{left:21px}
.setrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line-2)}
.setrow .sp{flex:1}
.setrow .tt{font-size:14.5px}
.setrow .dd{font-size:12px;color:var(--ink-3);margin-top:2px}
input[type=range]{width:100%;accent-color:var(--accent)}
</style>
</head>
<body>

<div id="app">
  <section class="page on" id="p-home"></section>
  <section class="page" id="p-lib"></section>
  <section class="page" id="p-ai"></section>
  <section class="page" id="p-me"></section>
</div>

<nav class="tabbar">
  <button class="tab on" data-go="home">
    <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.6V20h14V9.6"/><path d="M9.5 20v-6h5v6"/></svg>
    <span>首页</span>
  </button>
  <button class="tab" data-go="lib">
    <svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H5.5A1.5 1.5 0 0 1 4 16.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H14a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h4.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>
    <span>案例库</span>
  </button>
  <button class="tab mid" data-go="add">
    <div class="orb"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div>
    <span>添加</span>
  </button>
  <button class="tab" data-go="ai">
    <svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></svg>
    <span>助手</span>
  </button>
  <button class="tab" data-go="me">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>
    <span>我的</span>
  </button>
</nav>

<div id="layer"></div>

<script src="config.js"></script>

<script src="cases.js"></script>
<script src="app.js"></script>
</body>
</html>
